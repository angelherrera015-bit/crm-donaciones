<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Donaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f3;--ink:#16292b;--mut:#5d7274;--line:#d3dfdf;--pri:#0f5c63;--pri2:#0b4950;--card:#fff;--bad:#b3261e;--ok:#2e7d4f}
*{box-sizing:border-box}
body{margin:0;font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--pri);color:#fff;font-weight:600}
button:hover{background:var(--pri2)}
button.sec{background:#fff;color:var(--pri);border:1px solid var(--line)}
button.del{background:#fff;color:var(--bad);border:1px solid var(--line)}
:focus-visible{outline:3px solid #7cc4cb;outline-offset:2px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{background:#fff;padding:28px;border-radius:14px;width:100%;max-width:360px;border:1px solid var(--line)}
#login h1{margin:0 0 4px;font-size:1.5rem}
#login p{margin:0 0 12px;color:var(--mut)}
#login button{width:100%;margin-top:16px}
#err{color:var(--bad);min-height:1.2em;font-size:.9rem;margin-top:8px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--pri);color:#fff}
header h1{margin:0;font-size:1.15rem;flex:1;min-width:140px}
header button{background:rgba(255,255,255,.16)}
header button:hover{background:rgba(255,255,255,.28)}
header small{opacity:.85}
.ptabs{display:flex;gap:6px;padding:12px 16px 0;overflow-x:auto}
.ptabs button{background:#fff;color:var(--pri);border:1px solid var(--line);white-space:nowrap}
.ptabs button.on{background:var(--pri);color:#fff}
.ptabs button.add{background:transparent;border:1px dashed var(--pri)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;align-items:center}
.bar input{max-width:260px}
.tabs{display:flex;gap:6px;margin-right:auto}
.tabs button{background:transparent;color:var(--mut);border:1px solid transparent}
.tabs button.on{background:#fff;color:var(--pri);border-color:var(--line)}
.board{display:flex;gap:12px;padding:0 16px 24px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 250px;background:#e1ebeb;border-radius:12px;padding:10px;min-height:120px}
.col h3{margin:2px 4px 10px;font-size:.95rem;display:flex;justify-content:space-between}
.col h3 span{color:var(--mut);font-weight:400}
.col.over{outline:2px dashed var(--pri)}
.card{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line);cursor:pointer}
.card{border-left:6px solid var(--c,#94a3b8)}
.card b{display:block}
.logo{height:40px;width:auto;background:#fff;border-radius:10px;padding:5px 12px;display:block}
.card p.dir{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.8rem;color:var(--ink);margin:0 0 6px;border-left:2px solid var(--line);padding-left:6px}
.swrap{padding:0 16px 24px}
.stats{min-width:0}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-top:12px;align-items:stretch}
.kpi[data-go]{cursor:pointer}
.lp{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;scroll-margin-top:12px}
.lp h2{font-size:1rem;margin:0;display:flex;align-items:center;gap:8px}
.lp h2 button{margin-left:auto;padding:5px 12px;font-size:.8rem}
.lbody{max-height:460px;overflow:auto;margin-top:10px;padding-right:4px;scrollbar-width:thin}
.li{border-left:6px solid var(--c,#94a3b8);background:var(--bg);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.li b{display:block}
.li small{color:var(--mut)}
.li p{margin:3px 0 0;font-size:.85rem}
.li p.cl{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:.7rem;color:#fff;border-radius:99px;padding:1px 9px;margin-right:6px}
.stats .note{color:var(--mut);font-size:.9rem;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:5px solid var(--c,var(--pri))}
.kpi b{display:block;font-size:1.9rem;line-height:1.15}
.kpi span{color:var(--mut);font-size:.85rem}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h2{font-size:1rem;margin:0 0 10px}
.donut{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.legend{flex:1;min-width:180px;font-size:.88rem}
.legend div{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend em{margin-left:auto;font-style:normal;color:var(--mut);white-space:nowrap}
.hb{margin-bottom:12px;font-size:.88rem}
.stk{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#e5ecec;margin-top:5px}
.fu{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.chip{display:inline-block;font-size:.72rem;color:#fff;background:var(--c,#64748b);border-radius:99px;padding:1px 9px;margin-bottom:4px}
.utabs{display:flex;gap:6px;padding:8px 16px 0;overflow-x:auto}
.utabs button{background:#fff;color:var(--ink);border:1px solid var(--line);border-left:6px solid var(--c,#94a3b8);white-space:nowrap}
.utabs button.on{background:var(--c,var(--pri));color:#fff;border-color:var(--c,var(--pri))}
.card p{margin:3px 0 6px;color:var(--mut);font-size:.88rem}
.card small{display:inline-block;margin-right:10px;font-size:.8rem;color:var(--mut)}
.late{color:var(--bad)!important;font-weight:600}
.list{padding:0 16px 24px;max-width:760px}
.list h2{font-size:1rem;margin:18px 0 8px}
.row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.row span{color:var(--mut);font-size:.88rem}
.empty{color:var(--mut);padding:8px 2px}
dialog{border:0;border-radius:14px;padding:20px;width:min(520px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(10,30,32,.5)}
dialog h2{margin:0 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notes{margin-top:10px;font-size:.88rem;background:var(--bg);border-radius:8px;padding:8px 10px;max-height:150px;overflow:auto}
.notes div{margin-bottom:6px}.notes em{color:var(--mut);font-style:normal;font-size:.78rem}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.acts .sp{flex:1}
</style>
</head>
<body>

<div id="login">
  <form id="lf">
    <h1>CRM Donaciones</h1>
    <p>Inicia sesión para continuar.</p>
    <label for="em">Correo</label><input id="em" type="email" required autocomplete="username">
    <label for="pw">Contraseña</label><input id="pw" type="password" required autocomplete="current-password">
    <button>Iniciar sesión</button>
    <div id="err" role="alert"></div>
  </form>
</div>

    <small id="who"></small>
    <button id="eq" hidden>Equipo</button>
    <button id="csv">Exportar a Excel</button>
    <button id="out">Cerrar sesión</button>
  </header>
  <div class="ptabs" id="ptabs"></div>
  <div class="utabs" id="utabs"></div>
  <div class="bar">
    <div class="tabs">
      <button id="t1" class="on">Tablero</button>
      <button id="t2">Recordatorios</button>
      <button id="t3">Estadística</button>
    </div>

<dialog id="dlg">
  <h2 id="dt">Nueva donación</h2>
  <div id="rwrap"><label for="f_resp">Responsable</label><select id="f_resp"></select></div>
  <label for="f_proyecto">Proyecto</label><select id="f_proyecto"></select>
  <label for="f_empresa">Empresa</label><input id="f_empresa">
  <div class="g2">
    <div><label for="f_contacto">Contacto</label><input id="f_contacto"></div>
    <div><label for="f_tel">Teléfono</label><input id="f_tel" type="tel"></div>
  </div>
  <label for="f_correo">Correo del contacto</label><input id="f_correo" type="email">
  <label for="f_dir">Dirección confirmada para correspondencia</label><textarea id="f_dir" rows="2" placeholder="Ej. 5a avenida 10-20 zona 9, Ciudad de Guatemala. Atención: Lic. Pérez"></textarea>
  <label for="f_donacion">Qué se solicita o dona</label><input id="f_donacion">
  <div class="g2">
    <div><label for="f_monto">Valor aproximado (Q)</label><input id="f_monto" type="number" min="0" step="any"></div>
    <div><label for="f_etapa">Etapa</label><select id="f_etapa"></select></div>
  </div>
  <label for="f_seg">Próximo seguimiento</label><input id="f_seg" type="date">
  <label style="display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--ink)"><input id="f_logo" type="checkbox" style="width:auto"> Se solicitó el logotipo de la empresa</label>
  <label for="f_nota">Agregar comentario</label><textarea id="f_nota" rows="2"></textarea>
  <div class="notes" id="notes" hidden></div>
  <div class="acts">

    <button id="cancel" class="sec">Cancelar</button>
    <span class="sp"></span>
    <button id="del" class="del">Eliminar</button>
  </div>
</dialog>

</dialog>

const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app), col = collection(db,"donaciones"), pcol = collection(db,"proyectos"), ecol = collection(db,"equipo");

$("#lf").onsubmit = async e => {
  e.preventDefault(); $("#err").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("#em").value.trim(), $("#pw").value); }

  if (unsub) { unsub(); unsub = null; }
  if (unsub2) { unsub2(); unsub2 = null; }
  if (unsub3) { unsub3(); unsub3 = null; }
  if (u) {
    $("#who").textContent = u.email;
    me = u.email.toLowerCase(); isAdmin = !!ADMINS[me]; uv = me; $("#eq").hidden = !isAdmin;
    unsub3 = onSnapshot(ecol, s => { equipo = {}; s.docs.forEach(d => equipo[d.id] = d.data()); render(); }, () => {});
    unsub2 = onSnapshot(pcol, s => {
      projs = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => a.nombre.localeCompare(b.nombre));
      if (!["todos","sin"].includes(pv) && !projs.find(p => p.id === pv)) pv = "todos";
      render();
    }, e => alert("No se pudieron leer los proyectos: " + e.message));
    unsub = onSnapshot(col, s => { data = s.docs.map(d => ({id:d.id, ...d.data()})); render(); },
      e => alert("No se pudo leer la base de datos: " + e.message));
  } else { data = []; projs = []; equipo = {}; $("#pw").value = ""; }
});

const card = d => {
  const late = d.seguimiento && d.seguimiento < today() && !["Recibido","Rechazado"].includes(d.etapa);
  return `<div class="card" draggable="${canEdit(d)}" data-id="${d.id}" style="--c:${person(d.responsable).color}"><span class="chip">${esc(person(d.responsable).nombre)}</span><b>${esc(d.empresa)}</b>
  ${d.donacion ? `<p>${esc(d.donacion)}</p>` : ""}
  ${d.direccion ? `<p class="dir"><strong>Dirección:</strong> ${esc(d.direccion)}</p>` : ""}
  ${d.monto ? `<small>Q${Number(d.monto).toLocaleString("es-GT")}</small>` : ""}
  ${d.seguimiento ? `<small class="${late ? "late" : ""}">Seguimiento: ${d.seguimiento}</small>` : ""}${d.logo ? `<small>Logo solicitado ✓</small>` : ""}</div>`;
};

const lc = x => (x || "").toLowerCase();
const team = () => {
  const m = {}; Object.entries(ADMINS).forEach(([k,v]) => m[k] = {...v});
  Object.entries(equipo).forEach(([k,v]) => m[k] = {...(m[k] || {}), ...v});
  data.forEach(d => { const k = lc(d.responsable); if (k && !m[k]) m[k] = {nombre:k.split("@")[0], color:"#64748b"}; });
  if (me && !m[me]) m[me] = {nombre:me.split("@")[0], color:"#64748b"};
  return m;
};
const person = e => team()[lc(e)] || {nombre:"Sin responsable", color:"#94a3b8"};
const canEdit = d => isAdmin || lc(d.responsable) === me;
const inU = d => uv === "todos" || (uv === "sin" ? !d.responsable : lc(d.responsable) === uv);
function utabsHtml() {
  const t = team(), n = k => data.filter(d => lc(d.responsable) === k).length;
  const ks = Object.keys(t).sort((a,b) => (a === me ? -1 : b === me ? 1 : t[a].nombre.localeCompare(t[b].nombre)));
  return `<button data-u="todos" class="${uv === "todos" ? "on" : ""}">Todos (${data.length})</button>`
    + ks.map(k => `<button data-u="${esc(k)}" style="--c:${t[k].color}" class="${uv === k ? "on" : ""}">${esc(t[k].nombre)} (${n(k)})</button>`).join("")
    + (data.some(d => !d.responsable) ? `<button data-u="sin" class="${uv === "sin" ? "on" : ""}">Sin responsable</button>` : "");
}
$("#utabs").onclick = e => { const b = e.target.closest("button"); if (b) { uv = b.dataset.u; render(); } };
const noP = d => !d.proyecto || !projs.find(p => p.id === d.proyecto);
const inP = d => pv === "todos" || (pv === "sin" ? noP(d) : d.proyecto === pv);
const pname = id => projs.find(p => p.id === id)?.nombre || "Sin proyecto";
function tabsHtml() {
  const t = [["todos","Todos"], ...projs.map(p => [p.id,p.nombre]), ...(data.some(noP) ? [["sin","Sin proyecto"]] : [])];
  return t.map(([k,n]) => `<button data-p="${k}" class="${pv === k ? "on" : ""}">${esc(n)}</button>`).join("")
    + (isAdmin ? `<button class="add" id="np">+ Proyecto</button>` + (projs.find(p => p.id === pv) ? `<button class="add" id="rp">Renombrar</button>` : "") : "");
}
$("#ptabs").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  try {
    if (b.dataset.p) { pv = b.dataset.p; render(); }
    else if (b.id === "np") {
      const n = prompt("Nombre del nuevo proyecto (ej. Cena Navideña)");
      if (n && n.trim()) { const ref = await addDoc(pcol, {nombre:n.trim(), creado:serverTimestamp()}); pv = ref.id; render(); }
    } else if (b.id === "rp") {
      const n = prompt("Nuevo nombre del proyecto", pname(pv));
      if (n && n.trim()) await updateDoc(doc(db,"proyectos",pv), {nombre:n.trim()});
    }
  } catch (x) { alert("No se pudo guardar el proyecto: " + x.message); }
};
const SC = {"Prospecto":"#94a3b8","Contactado":"#38bdf8","Oficio enviado":"#6366f1","En seguimiento":"#f59e0b","Confirmado":"#22c55e","Recibido":"#15803d","Rechazado":"#dc2626"};
function donut(items, centro, sub) {
  const tot = items.reduce((a,i) => a + i.n, 0), R = 52, C = 2 * Math.PI * R; let off = 0;
  const arcs = tot ? items.filter(i => i.n).map(i => { const l = C * i.n / tot; const a = `<circle r="${R}" cx="70" cy="70" fill="none" stroke="${i.c}" stroke-width="22" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off += l; return a; }).join("")
    : `<circle r="${R}" cx="70" cy="70" fill="none" stroke="#e5ecec" stroke-width="22"/>`;
  return `<div class="donut"><svg viewBox="0 0 140 140" width="160" height="160" role="img" aria-label="Gráfico circular">${arcs}<text x="70" y="75" text-anchor="middle" font-size="26" font-weight="700" fill="#16292b">${centro}</text><text x="70" y="91" text-anchor="middle" font-size="10" fill="#5d7274">${sub}</text></svg>
  <div class="legend">${items.map(i => `<div><i style="background:${i.c}"></i>${esc(i.t)}<em>${i.n} · ${tot ? Math.round(i.n * 100 / tot) : 0}%</em></div>`).join("")}</div></div>`;
}
function statsHtml() {
  const S = data.filter(inP).filter(inU), N = S.length, t = today();
  const w = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4 + 7 * 864e5).toISOString().slice(0,10);
  const ok = S.filter(d => ["Confirmado","Recibido"].includes(d.etapa)), no = S.filter(d => d.etapa === "Rechazado");
  const A = S.filter(d => !["Confirmado","Recibido","Rechazado"].includes(d.etapa)), act = S.filter(d => !["Recibido","Rechazado"].includes(d.etapa));
  const pc = n => N ? Math.round(n * 100 / N) : 0, dec = ok.length + no.length;
  const venc = act.filter(d => d.seguimiento && d.seguimiento < t).length, hoy = act.filter(d => d.seguimiento === t).length;
  const prox = act.filter(d => d.seguimiento > t && d.seguimiento <= w).length, sin = act.filter(d => !d.seguimiento).length;
  const kp = (n, l, c, go) => `<div class="kpi" style="--c:${c}"${go ? ` data-go="${go}" role="button" tabindex="0"` : ""}><b>${n}</b><span>${l}</span></div>`;
  const etiqueta = (pv === "todos" ? "Todos los proyectos" : pv === "sin" ? "Sin proyecto" : pname(pv)) + " · " + (uv === "todos" ? "Todos los encargados" : uv === "sin" ? "Sin responsable" : person(uv).nombre);
  const T = team(), ppl = Object.keys(T).map(k => ({k, d:S.filter(x => lc(x.responsable) === k)})).filter(x => x.d.length).sort((a,b) => b.d.length - a.d.length);
  const hb = ppl.map(({k,d}) => { const o = d.filter(x => ["Confirmado","Recibido"].includes(x.etapa)).length, n = d.filter(x => x.etapa === "Rechazado").length, p = d.length - o - n, f = v => (v * 100 / d.length).toFixed(1);
    return `<div class="hb"><span style="color:${T[k].color}">●</span> <b>${esc(T[k].nombre)}</b> · ${d.length} empresas<div class="stk"><span style="width:${f(o)}%;background:#22c55e"></span><span style="width:${f(p)}%;background:#f59e0b"></span><span style="width:${f(n)}%;background:#dc2626"></span></div><span style="color:var(--mut)">${o} confirman · ${p} en proceso · ${n} dijeron que no</span></div>`; }).join("");
  const ord = {"Recibido":0,"Confirmado":1}, last = d => (d.notas && d.notas.length) ? d.notas[d.notas.length - 1].t : "";
  const okL = ok.slice().sort((a,b) => ord[a.etapa] - ord[b.etapa] || (a.empresa || "").localeCompare(b.empresa || ""));
  const noL = no.slice().sort((a,b) => (a.empresa || "").localeCompare(b.empresa || ""));
  const rowOk = d => { const pe = person(d.responsable); return `<div class="li" data-id="${d.id}" style="--c:${pe.color}"><b>${esc(d.empresa)}</b><div><span class="tag" style="background:${SC[d.etapa]}">${d.etapa}</span><small style="color:${pe.color}"><b style="display:inline">${esc(pe.nombre)}</b></small>${d.monto ? ` <small>· Q${Number(d.monto).toLocaleString("es-GT")}</small>` : ""}${d.seguimiento ? ` <small>· ${d.seguimiento}</small>` : ""}</div><p>${esc(d.donacion) || "<em>Sin detalle de la donación</em>"}</p></div>`; };
  const rowNo = d => { const pe = person(d.responsable); return `<div class="li" data-id="${d.id}" style="--c:${pe.color}"><b>${esc(d.empresa)}</b><div><span class="tag" style="background:${pe.color}">${esc(pe.nombre)}</span></div><p class="cl">${esc(last(d)) || "<em>Sin comentarios</em>"}</p></div>`; };
  const listaOk = `<div class="lp" id="lst-ok" style="border-top:5px solid #22c55e"><h2>Donan o confirman (${okL.length})<button class="sec" data-x="ok">Excel</button></h2><div class="lbody">${okL.map(rowOk).join("") || '<div class="empty">Ninguna todavía.</div>'}</div></div>`;
  const listaNo = `<div class="lp" id="lst-no" style="border-top:5px solid #dc2626"><h2>Dijeron que no (${noL.length})<button class="sec" data-x="no">Excel</button></h2><div class="lbody">${noL.map(rowNo).join("") || '<div class="empty">Ninguna.</div>'}</div></div>`;
  return `<div class="swrap"><div class="stats"><p class="note">Mostrando: <b>${esc(etiqueta)}</b>. Cambia el proyecto o el encargado con las pestañas de arriba.</p>
  <div class="kpis">${kp(N,"Empresas en total","#0f5c63")}${kp(ok.length + " (" + pc(ok.length) + "%)","Donan o confirman","#22c55e","lst-ok")}${kp(no.length + " (" + pc(no.length) + "%)","Dijeron que no","#dc2626","lst-no")}${kp(A.length + " (" + pc(A.length) + "%)","En proceso","#f59e0b")}${kp(dec ? Math.round(ok.length * 100 / dec) + "%" : "–","Aceptación entre las que ya respondieron","#6366f1")}${kp(ok.filter(d => d.logo).length + " de " + ok.length,"Logotipos solicitados (confirmadas)","#0f5c63")}</div>
  <div class="panels">
    <div class="panel"><h2>Empresas por etapa</h2>${donut(ST.map(s => ({t:s, n:S.filter(d => d.etapa === s).length, c:SC[s]})), N, "empresas")}</div>
    <div class="panel"><h2>Resultado general</h2>${donut([{t:"Donan o confirman", n:ok.length, c:"#22c55e"},{t:"En proceso", n:A.length, c:"#f59e0b"},{t:"Dijeron que no", n:no.length, c:"#dc2626"}], pc(ok.length) + "%", "confirman")}</div>
    <div class="panel"><h2>Seguimientos pendientes</h2><div class="fu"><span>Vencidos</span><b class="${venc ? "late" : ""}">${venc}</b></div><div class="fu"><span>Para hoy</span><b>${hoy}</b></div><div class="fu"><span>Próximos 7 días</span><b>${prox}</b></div><div class="fu"><span>Activas sin fecha de seguimiento</span><b>${sin}</b></div></div>
    <div class="panel" style="grid-column:1/-1"><h2>Por encargado</h2>${hb || '<div class="empty">Sin datos.</div>'}</div>
  </div></div><div class="lists">${listaOk}${listaNo}</div></div>`;
}
function exportLista(k) {
  const S = data.filter(inP).filter(inU);
  const L = k === "ok" ? S.filter(d => ["Confirmado","Recibido"].includes(d.etapa)) : S.filter(d => d.etapa === "Rechazado");
  const h = k === "ok" ? ["Proyecto","Encargado","Empresa","Etapa","Donación","Valor (Q)","Próximo seguimiento","Logo solicitado","Dirección confirmada"] : ["Proyecto","Encargado","Empresa","Último comentario","Todos los comentarios"];
  const rows = L.map(d => k === "ok" ? [pname(d.proyecto),person(d.responsable).nombre,d.empresa,d.etapa,d.donacion,d.monto,d.seguimiento,d.logo ? "Sí" : "No",d.direccion] : [pname(d.proyecto),person(d.responsable).nombre,d.empresa,(d.notas || []).slice(-1).map(x => x.t).join(""),(d.notas || []).map(x => x.t).join(" | ")]);
  const csv = [h,...rows].map(a => a.map(c => `"${String(c ?? "").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8"}));
  a.download = (k === "ok" ? "donan-o-confirman-" : "dijeron-que-no-") + today() + ".csv"; a.click();
}
function render() {
  $("#ptabs").innerHTML = tabsHtml();
  $("#utabs").innerHTML = utabsHtml();
  const q = $("#q").value.toLowerCase();
  const L = data.filter(inP).filter(inU).filter(d => [d.empresa,d.contacto,d.donacion,d.direccion].join(" ").toLowerCase().includes(q));
  if (view === "tablero") {
    $("#main").innerHTML = `<div class="board">` + ST.map(s => {
      const c = L.filter(d => d.etapa === s);
      return `<div class="col" data-s="${s}"><h3>${s}<span>${c.length}</span></h3>${c.map(card).join("")}</div>`;
    }).join("") + `</div>`;
  } else if (view === "recordatorios") {
    const t = today(), open = L.filter(d => d.seguimiento && !["Recibido","Rechazado"].includes(d.etapa)).sort((a,b) => a.seguimiento.localeCompare(b.seguimiento));
    const grp = (title, arr) => `<h2>${title} (${arr.length})</h2>` + (arr.length ? arr.map(d =>
      `<div class="row" data-id="${d.id}"><div><b>${esc(d.empresa)}</b> <span style="color:${person(d.responsable).color}">● ${esc(person(d.responsable).nombre)}</span><br><span>${esc(d.donacion)} · ${esc(d.contacto)} ${esc(d.telefono)}</span></div><span class="${d.seguimiento < t ? "late" : ""}">${d.seguimiento}</span></div>`).join("") : `<div class="empty">Sin pendientes.</div>`);
    $("#main").innerHTML = `<div class="list">${grp("Vencidos", open.filter(d => d.seguimiento < t))}${grp("Hoy", open.filter(d => d.seguimiento === t))}${grp("Próximos", open.filter(d => d.seguimiento > t))}</div>`;
  } else { $("#main").innerHTML = statsHtml(); }
}

const main = $("#main");
main.onclick = e => {
  const x = e.target.closest("[data-x]"); if (x) { exportLista(x.dataset.x); return; }
  const g = e.target.closest("[data-go]"); if (g) { document.getElementById(g.dataset.go)?.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const el = e.target.closest("[data-id]"); if (el) openDlg(data.find(d => d.id === el.dataset.id));
};
main.ondragstart = e => { const c = e.target.closest(".card"); if (!c) return; const d = data.find(x => x.id === c.dataset.id); if (!d || !canEdit(d)) { e.preventDefault(); return; } e.dataTransfer.setData("text/plain", c.dataset.id); };
main.ondragover = e => { const c = e.target.closest(".col"); if (c) { e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); c.classList.add("over"); } };
main.ondrop = async e => {
  const c = e.target.closest(".col"); if (!c) return; e.preventDefault();
  const id = e.dataTransfer.getData("text/plain");
  try { await updateDoc(doc(db,"donaciones",id), {etapa: c.dataset.s}); } catch (x) { alert("No se pudo mover: " + x.message); }
};
main.ondragend = () => document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over"));

const tab = v => { view = v; [["t1","tablero"],["t2","recordatorios"],["t3","estadistica"]].forEach(([id,k]) => $("#" + id).classList.toggle("on", v === k)); render(); };
$("#t1").onclick = () => tab("tablero"); $("#t2").onclick = () => tab("recordatorios"); $("#t3").onclick = () => tab("estadistica");
$("#q").oninput = render;
$("#new").onclick = () => openDlg(null);

const F = ["empresa","contacto","tel","correo","donacion","monto","etapa","seg"];
function openDlg(d) {
  cur = d;
  const T = team();
  $("#f_resp").innerHTML = `<option value="">Sin responsable</option>` + Object.keys(T).map(k => `<option value="${esc(k)}">${esc(T[k].nombre)}</option>`).join("");
  $("#f_resp").value = d ? lc(d.responsable) : (T[uv] ? uv : me);
  $("#rwrap").hidden = !isAdmin;
  $("#f_proyecto").innerHTML = `<option value="">Sin proyecto</option>` + projs.map(p => `<option value="${p.id}">${esc(p.nombre)}</option>`).join("");
  $("#f_proyecto").value = d ? (d.proyecto || "") : (projs.find(p => p.id === pv) ? pv : "");
  $("#dt").textContent = d ? d.empresa : "Nueva donación";
  const m = {empresa:d?.empresa, contacto:d?.contacto, tel:d?.telefono, correo:d?.correo, donacion:d?.donacion, monto:d?.monto, etapa:d?.etapa || ST[0], seg:d?.seguimiento};
  F.forEach(k => $("#f_" + k).value = m[k] ?? "");
  $("#f_nota").value = "";
  $("#f_logo").checked = !!d?.logo;
  $("#f_dir").value = d?.direccion ?? "";
  const n = d?.notas || [];
  $("#notes").hidden = !n.length;
  $("#notes").innerHTML = n.slice().reverse().map(x => `<div>${esc(x.t)}<br><em>${esc(x.u)} · ${new Date(x.d).toLocaleDateString("es-GT")}</em></div>`).join("");
  const ro = !!d && !canEdit(d);
  document.querySelectorAll("#dlg input, #dlg select, #dlg textarea").forEach(x => x.disabled = ro);
  $("#save").hidden = ro; $("#del").hidden = !d || ro;
  $("#dlg").showModal();
}
$("#cancel").onclick = () => $("#dlg").close();

$("#save").onclick = async () => {
  const v = {empresa:$("#f_empresa").value.trim(), contacto:$("#f_contacto").value.trim(), telefono:$("#f_tel").value.trim(), correo:$("#f_correo").value.trim(),
    donacion:$("#f_donacion").value.trim(), monto:$("#f_monto").value, etapa:$("#f_etapa").value, proyecto:$("#f_proyecto").value, direccion:$("#f_dir").value.trim(), logo:$("#f_logo").checked, seguimiento:$("#f_seg").value, actualizado:serverTimestamp()};
  if (!v.empresa) { alert("Escribe el nombre de la empresa."); return; }
  const n = $("#f_nota").value.trim(), nota = {t:n, u:auth.currentUser.email, d:new Date().toISOString()};
  try {
    if (cur) { if (isAdmin) v.responsable = $("#f_resp").value; if (n) v.notas = arrayUnion(nota); await updateDoc(doc(db,"donaciones",cur.id), v); }
    else { v.notas = n ? [nota] : []; v.responsable = isAdmin ? ($("#f_resp").value || me) : me; v.creado = serverTimestamp(); await addDoc(col, v); }
    $("#dlg").close();
  } catch (x) { alert("No se pudo guardar: " + x.message); }
};
$("#del").onclick = async () => {
  if (!cur || !confirm("¿Eliminar esta donación? No se puede deshacer.")) return;
  try { await deleteDoc(doc(db,"donaciones",cur.id)); $("#dlg").close(); } catch (x) { alert("No se pudo eliminar: " + x.message); }
};

$("#eq").onclick = () => { drawEq(); $("#dlg2").showModal(); };
$("#e_close").onclick = () => $("#dlg2").close();
function drawEq() {
  $("#eqlist").innerHTML = Object.entries(team()).map(([k,v]) => `<div data-k="${esc(k)}" style="cursor:pointer;margin-bottom:6px"><span style="color:${v.color}">●</span> ${esc(v.nombre)} <em>${esc(k)}${ADMINS[k] ? " · maestro" : ""}</em></div>`).join("");
}
$("#eqlist").onclick = e => { const el = e.target.closest("[data-k]"); if (!el) return; const v = team()[el.dataset.k]; $("#e_email").value = el.dataset.k; $("#e_nombre").value = v.nombre; $("#e_color").value = v.color; };
$("#e_save").onclick = async () => {
  const k = $("#e_email").value.trim().toLowerCase(), nombre = $("#e_nombre").value.trim();
  if (!k || !nombre) { alert("Escribe el correo y el nombre."); return; }
  try { await setDoc(doc(db,"equipo",k), {nombre, color:$("#e_color").value}); $("#e_email").value = ""; $("#e_nombre").value = ""; drawEq(); }
  catch (x) { alert("No se pudo guardar: " + x.message); }
};
$("#csv").onclick = () => {
  const dt = t => { if (!t || !t.toDate) return ""; const x = t.toDate(); return new Date(x.getTime() - x.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
  const h = ["Proyecto","Responsable","Correo responsable","Empresa","Contacto","Teléfono","Correo","Dirección confirmada","Donación","Valor (Q)","Etapa","Próximo seguimiento","Logo solicitado","Creado","Última actualización","Comentarios"];
  const r = data.filter(inP).filter(inU).map(d => [pname(d.proyecto),person(d.responsable).nombre,d.responsable,d.empresa,d.contacto,d.telefono,d.correo,d.direccion,d.donacion,d.monto,d.etapa,d.seguimiento,d.logo ? "Sí" : "No",dt(d.creado),dt(d.actualizado),(d.notas||[]).map(x => x.t).join(" | ")]);
  const csv = [h,...r].map(a => a.map(c => `"${String(c ?? "").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], {type:"text/csv;charset=utf-8"}));
  a.download = "donaciones-" + today() + ".csv"; a.click();
};
</script>
