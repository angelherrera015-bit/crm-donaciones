<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Donaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=3">
<meta name="theme-color" content="#0f5c63">
</head>
<body>

<div id="login">
  <form id="lf">
    <h1>CRM Donaciones</h1>
    <p>Inicia sesión para continuar.</p>
    <label for="em">Correo</label><input id="em" type="email" required autocomplete="username">
    <label for="pw">Contraseña</label><input id="pw" type="password" required autocomplete="current-password">
    <button>Iniciar sesión</button>
    <div id="err" role="alert"></div>
  </form>
</div>

<div id="app" hidden>
  <header>
    <img class="logo" alt="Municipalidad de Guatemala, 250 años" src="logo.png">
    <h1>CRM Donaciones</h1>
    <small id="who"></small>
    <button id="eq" hidden>Equipo</button>
    <button id="csv">Exportar a Excel</button>
    <button id="out">Cerrar sesión</button>
  </header>
  <div class="ptabs" id="ptabs"></div>
  <div class="utabs" id="utabs"></div>
  <div class="bar">
    <div class="tabs">
      <button id="t1" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg>Tablero</button>
      <button id="t2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>Recordatorios</button>
      <button id="t3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Estadística</button>
      <button id="t4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendario</button>
    </div>
    <input id="q" type="search" placeholder="Buscar empresa, contacto, donación o dirección">
    <button id="new">Nueva donación</button>
  </div>
  <main id="main"></main>
</div>

<dialog id="dlg">
  <h2 id="dt">Nueva donación</h2>
  <div id="rwrap"><label for="f_resp">Responsable</label><select id="f_resp"></select>
  <label for="f_lleva">Quién lleva el contacto</label><select id="f_lleva"></select></div>
  <label for="f_proyecto">Proyecto</label><select id="f_proyecto"></select>
  <label for="f_empresa">Empresa</label><input id="f_empresa">
  <div class="g2">
    <div><label for="f_contacto">Contacto</label><input id="f_contacto"></div>
    <div><label for="f_tel">Teléfono</label><input id="f_tel" type="tel"></div>
  </div>
  <label for="f_correo">Correo del contacto</label><input id="f_correo" type="email">
  <label for="f_dir">Dirección confirmada para correspondencia</label><textarea id="f_dir" rows="2" placeholder="Ej. 5a avenida 10-20 zona 9, Ciudad de Guatemala. Atención: Lic. Pérez"></textarea>
  <label for="f_donacion">Qué se solicita o dona</label><input id="f_donacion">
  <label>Detalle confirmado: descripción y cantidad (para el reporte)</label>
  <div id="f_items"></div>
  <div class="acts" style="margin-top:6px"><button type="button" id="it_add" class="sec">+ Agregar producto</button><button type="button" id="it_sep" class="sec">Separar desde el texto</button></div>
  <div class="g2">
    <div><label for="f_monto">Valor aproximado (Q)</label><input id="f_monto" type="number" min="0" step="any"></div>
    <div><label for="f_etapa">Etapa</label><select id="f_etapa"></select></div>
  </div>
  <label for="f_seg">Próximo seguimiento</label><input id="f_seg" type="date">
  <label style="display:flex;align-items:center;gap:8px;margin-top:14px;color:var(--ink)"><input id="f_logo" type="checkbox" style="width:auto"> Se solicitó el logotipo de la empresa</label>
  <label for="f_nota">Agregar comentario</label><textarea id="f_nota" rows="2"></textarea>
  <div class="notes" id="notes" hidden></div>
  <div class="acts">
    <button id="save">Guardar</button>
    <button id="cancel" class="sec">Cancelar</button>
    <span class="sp"></span>
    <button id="del" class="del">Eliminar</button>
  </div>
</dialog>

<dialog id="dlg2">
  <h2>Equipo</h2>
  <p style="color:var(--mut);font-size:.85rem;margin:0 0 6px">Toca una persona para editarla, o escribe un correo nuevo.</p>
  <div class="notes" id="eqlist" style="max-height:200px"></div>
  <label for="e_email">Correo</label><input id="e_email" type="email">
  <label for="e_nombre">Nombre</label><input id="e_nombre">
  <label for="e_color">Color</label><input id="e_color" type="color" value="#1d4ed8">
  <div class="acts"><button id="e_save">Guardar persona</button><button id="e_close" class="sec">Cerrar</button></div>
  <div id="e_del" hidden style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">
    <div id="e_destw"><label for="e_dest">Al quitarla, pasar sus donaciones a</label><select id="e_dest"></select></div>
    <div class="acts"><button id="e_rm" class="del">Quitar del equipo</button></div>
    <p id="e_note" style="font-size:.82rem;color:var(--mut);margin:8px 0 0"></p>
  </div>
</dialog>

<datalist id="dl-emp"></datalist>
<dialog id="dlgAg">
  <h2 id="ag_t">Nueva recepción o visita</h2>
  <label for="ag_modo">Modalidad</label><select id="ag_modo"><option value="recepcion">Recepción: la empresa viene a Desarrollo Social</option><option value="visita">Visita / recolección: vamos a la empresa</option></select>
  <label for="ag_emp">Empresa (debe estar en la base)</label><input id="ag_emp" list="dl-emp" autocomplete="off" placeholder="Escribe para buscar">
  <div class="g2"><div><label for="ag_enc">Encargado</label><select id="ag_enc"></select></div><div><label for="ag_est">Estado</label><select id="ag_est"></select></div></div>
  <div class="g2"><div><label for="ag_fecha">Fecha</label><input id="ag_fecha" type="date"></div><div><label for="ag_tr">¿Necesita transporte?</label><select id="ag_tr"><option value="no">No</option><option value="si">Sí</option></select></div></div>
  <div class="g2"><div><label for="ag_ini">Hora de inicio</label><input id="ag_ini" type="time"></div><div><label for="ag_fin">Hora de fin</label><input id="ag_fin" type="time"></div></div>
  <label for="ag_dir">Dirección</label><textarea id="ag_dir" rows="2"></textarea><small id="ag_warn" class="warn"></small>
  <div class="g2"><div><label for="ag_det">Tipo de donación</label><input id="ag_det"></div><div><label for="ag_cant">Cantidad</label><input id="ag_cant" type="number" min="0" step="any"></div></div>
  <label for="ag_obs">Observaciones</label><textarea id="ag_obs" rows="2"></textarea>
  <div class="notes" id="ag_hist" hidden></div>
  <div class="acts"><button id="ag_save">Guardar</button><button id="ag_cancel" class="sec">Cancelar</button><span class="sp"></span><button id="ag_del" class="del">Eliminar</button></div>
</dialog>

<script type="module" src="app.js?v=3"></script>
</body>
</html>
